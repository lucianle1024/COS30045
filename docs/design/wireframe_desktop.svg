<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1058" role="img" aria-label="Desktop website wireframe with reading order, charts and controls"><title>Desktop website wireframe with reading order, charts and controls</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#142b3d} .small{font-size:15px}.label{font-size:19px;font-weight:700}</style><rect width="1120" height="1058" fill="#f8f7f3"/><text x="28" y="38" font-size="24" font-weight="bold">DESKTOP / planned 1440 px layout</text><rect x="28" y="62" width="1064" height="65" rx="6" fill="white" stroke="#51616a"/><text x="44" y="91" font-size="18" font-weight="bold">Gr_01 / Beyond the Total</text><text x="44" y="117" font-size="16" font-weight="normal">Anchor navigation: Compare | Events | Ages | Method   /   Reset story</text><rect x="28" y="145" width="1064" height="120" rx="6" fill="white" stroke="#51616a"/><text x="44" y="174" font-size="18" font-weight="bold">01 / One decline, different directions</text><text x="44" y="200" font-size="16" font-weight="normal">2019-2020: national -4.8%; cyclists +14.1%. Counts are not exposure-adjusted risk.</text><text x="44" y="223" font-size="16" font-weight="normal">Brief national trend 2011-2021 below the opening; mark the 2012 and 2017 breaks.</text><rect x="28" y="283" width="292" height="188" rx="6" fill="white" stroke="#51616a"/><text x="44" y="312" font-size="18" font-weight="bold">02 / Compare</text><text x="44" y="338" font-size="16" font-weight="normal">Question and short finding</text><text x="44" y="361" font-size="16" font-weight="normal">Year A: 2019 / Year B: 2020</text><text x="44" y="384" font-size="16" font-weight="normal">Select road user: cyclist</text><text x="44" y="407" font-size="16" font-weight="normal">All 12 road users retained</text><text x="44" y="430" font-size="16" font-weight="normal">Year colours stay fixed</text><rect x="340" y="283" width="752" height="188" rx="6" fill="white" stroke="#51616a"/><text x="356" y="312" font-size="18" font-weight="bold">Dumbbell / shared count axis starts at zero</text><text x="356" y="338" font-size="16" font-weight="normal">2019 circle / 2020 diamond; count and signed-change labels</text><text x="356" y="361" font-size="16" font-weight="normal">Selected row: outline and bold label; no colour reassignment</text><text x="356" y="384" font-size="16" font-weight="normal">Exact values available by focus and in the chapter table</text><rect x="28" y="489" width="1064" height="82" rx="6" fill="white" stroke="#51616a"/><text x="44" y="518" font-size="18" font-weight="bold">Detail controls / separate from the comparison years</text><text x="44" y="544" font-size="16" font-weight="normal">Detail year: 2021 / Road user: Pedal cyclist / Always show both in the heading</text><rect x="28" y="588" width="292" height="151" rx="6" fill="white" stroke="#51616a"/><text x="44" y="617" font-size="18" font-weight="bold">03 / Event classifications</text><text x="44" y="643" font-size="16" font-weight="normal">What was recorded?</text><text x="44" y="666" font-size="16" font-weight="normal">3,705 / 8,163 = 45.4%</text><text x="44" y="689" font-size="16" font-weight="normal">Non-collision is a category</text><text x="44" y="712" font-size="16" font-weight="normal">Links do not identify fault</text><rect x="340" y="588" width="752" height="151" rx="6" fill="white" stroke="#51616a"/><text x="356" y="617" font-size="18" font-weight="bold">Two-column Sankey / one selected group</text><text x="356" y="643" font-size="16" font-weight="normal">Road user -&gt; recorded counterparty; link width = Hospitalisations</text><text x="356" y="666" font-size="16" font-weight="normal">Non-collision and unspecified stay separate; full category table</text><text x="356" y="689" font-size="16" font-weight="normal">Candidate matrix if between-group comparison is the main task</text><rect x="28" y="757" width="292" height="151" rx="6" fill="white" stroke="#51616a"/><text x="44" y="786" font-size="18" font-weight="bold">04 / Age profiles</text><text x="44" y="812" font-size="16" font-weight="normal">Compare composition</text><text x="44" y="835" font-size="16" font-weight="normal">2021 / all source sexes</text><text x="44" y="858" font-size="16" font-weight="normal">Unequal age-band widths</text><text x="44" y="881" font-size="16" font-weight="normal">Unknown stays in denominator</text><rect x="340" y="757" width="752" height="151" rx="6" fill="white" stroke="#51616a"/><text x="356" y="786" font-size="18" font-weight="bold">Heatmap / all 12 groups x 8 age categories</text><text x="356" y="812" font-size="16" font-weight="normal">Default: within-road-user % / alternative: count</text><text x="356" y="835" font-size="16" font-weight="normal">Sequential scale, exact labels, selected row outline</text><text x="356" y="858" font-size="16" font-weight="normal">Legend and table update with the metric</text><rect x="28" y="926" width="1064" height="104" rx="6" fill="white" stroke="#51616a"/><text x="44" y="955" font-size="18" font-weight="bold">05 / Takeaway, exact values and method</text><text x="44" y="981" font-size="16" font-weight="normal">A table below each chapter; source/release, denominator and recording-break notes</text><text x="44" y="1004" font-size="16" font-weight="normal">Conclude with the three observations. Do not imply 2021 profiles explain a 2020 change.</text></svg>

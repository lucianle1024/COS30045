<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 681" role="img" aria-label="Proposed cyclist counterparty Sankey with count-preserving grouped categories"><title>Proposed cyclist counterparty Sankey with count-preserving grouped categories</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#142b3d} .small{font-size:15px}.label{font-size:19px;font-weight:700}</style><rect width="1060" height="681" fill="#f8f7f3"/><text x="24" y="38" font-size="24" font-weight="bold">03 / What was recorded within cyclist hospitalisations?</text><text x="24" y="70" font-size="18" font-weight="normal">CANDIDATE / one-group Sankey | 2021 | widths encode Hospitalisations</text><text x="24" y="150" font-size="22" font-weight="bold">Pedal cyclist</text><text x="24" y="181" font-size="18" font-weight="normal">8,163 hospitalisations</text><rect x="250" y="170" width="18" height="350" fill="#244d68"/><path d="M268,170 C430,170 430,122 592,122 L592,280.8570378537303 C430,280.8570378537303 430,328.8570378537303 268,328.8570378537303 Z" fill="#244d68" fill-opacity=".55" stroke="#244d68"/><rect x="592" y="122" width="18" height="158.85703785373025" fill="#244d68"/><text x="630" y="191.42851892686514" font-size="18" font-weight="bold">Non-collision transport accident</text><text x="630" y="219.42851892686514" font-size="17" font-weight="normal">3,705 / 8,163 = 45.4%</text><path d="M268,328.8570378537303 C430,328.8570378537303 430,312.8570378537303 592,312.8570378537303 L592,392.3498713708196 C430,392.3498713708196 430,408.3498713708196 268,408.3498713708196 Z" fill="#a74527" fill-opacity=".55" stroke="#a74527"/><rect x="592" y="312.8570378537303" width="18" height="79.49283351708931" fill="#a74527"/><text x="630" y="342.60345461227496" font-size="18" font-weight="bold">Other and unspecified transport</text><text x="630" y="365.60345461227496" font-size="18" font-weight="bold">accidents</text><text x="630" y="393.60345461227496" font-size="17" font-weight="normal">1,854 / 8,163 = 22.7%</text><path d="M268,408.3498713708196 C430,408.3498713708196 430,424.3498713708196 592,424.3498713708196 L592,491.880191106211 C430,491.880191106211 430,475.880191106211 268,475.880191106211 Z" fill="#177568" fill-opacity=".55" stroke="#177568"/><rect x="592" y="424.3498713708196" width="18" height="67.5303197353914" fill="#177568"/><text x="630" y="448.11503123851526" font-size="18" font-weight="bold">Car, pick-up truck or van</text><text x="630" y="476.11503123851526" font-size="17" font-weight="normal">1,575 / 8,163 = 19.3%</text><path d="M268,475.880191106211 C430,475.880191106211 430,523.880191106211 592,523.880191106211 L592,568.0 C430,568.0 430,520.0 268,520.0 Z" fill="#77818d" fill-opacity=".55" stroke="#77818d"/><rect x="592" y="523.880191106211" width="18" height="44.11980889378905" fill="#77818d"/><text x="630" y="535.9400955531055" font-size="18" font-weight="bold">Other recorded categories</text><text x="630" y="563.9400955531055" font-size="17" font-weight="normal">1,029 / 8,163 = 12.6%</text><text x="24" y="601" font-size="17" font-weight="normal">Links represent classifications, not movement, time order, causation or fault.</text><text x="24" y="628" font-size="17" font-weight="normal">Other recorded categories = seven remaining source labels; unspecified remains separate.</text><text x="24" y="655" font-size="17" font-weight="normal">Alternative: a row-normalised matrix for comparing groups; narrow screens: bars + table.</text></svg>

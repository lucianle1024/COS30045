<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 425 1143" role="img" aria-label="Narrow-screen wireframe showing compact chart and table alternatives"><title>Narrow-screen wireframe showing compact chart and table alternatives</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#142b3d} .small{font-size:15px}.label{font-size:19px;font-weight:700}</style><rect width="425" height="1143" fill="#f8f7f3"/><text x="20" y="35" font-size="20" font-weight="bold">MOBILE / planned 375 px layout</text><rect x="20" y="56" width="365" height="111" rx="6" fill="white" stroke="#51616a"/><text x="36" y="85" font-size="18" font-weight="bold">Header and anchors</text><text x="36" y="111" font-size="16" font-weight="normal">Skip to story / chapter links wrap</text><text x="36" y="134" font-size="16" font-weight="normal">Reset restores defaults, keeps scroll</text><rect x="20" y="182" width="365" height="111" rx="6" fill="white" stroke="#51616a"/><text x="36" y="211" font-size="18" font-weight="bold">Opening question</text><text x="36" y="237" font-size="16" font-weight="normal">National -4.8% / cyclist +14.1%</text><text x="36" y="260" font-size="16" font-weight="normal">2019-2020 stays visible</text><rect x="20" y="308" width="365" height="111" rx="6" fill="white" stroke="#51616a"/><text x="36" y="337" font-size="18" font-weight="bold">Compare controls + question</text><text x="36" y="363" font-size="16" font-weight="normal">Year A / Year B / road user</text><text x="36" y="386" font-size="16" font-weight="normal">Native controls, full-width labels</text><rect x="20" y="434" width="365" height="134" rx="6" fill="white" stroke="#51616a"/><text x="36" y="463" font-size="18" font-weight="bold">Compact comparison</text><text x="36" y="489" font-size="16" font-weight="normal">Selected group: paired count bars</text><text x="36" y="512" font-size="16" font-weight="normal">2019 / 2020 labels + signed change</text><text x="36" y="535" font-size="16" font-weight="normal">All 12 groups in table below</text><rect x="20" y="583" width="365" height="111" rx="6" fill="white" stroke="#51616a"/><text x="36" y="612" font-size="18" font-weight="bold">Detail year / road user</text><text x="36" y="638" font-size="16" font-weight="normal">2021 / Pedal cyclist</text><text x="36" y="661" font-size="16" font-weight="normal">Independent of comparison years</text><rect x="20" y="709" width="365" height="134" rx="6" fill="white" stroke="#51616a"/><text x="36" y="738" font-size="18" font-weight="bold">Recorded event categories</text><text x="36" y="764" font-size="16" font-weight="normal">Horizontal share bars + counts</text><text x="36" y="787" font-size="16" font-weight="normal">All categories in exact table</text><text x="36" y="810" font-size="16" font-weight="normal">Sankey replaced when too narrow</text><rect x="20" y="858" width="365" height="134" rx="6" fill="white" stroke="#51616a"/><text x="36" y="887" font-size="18" font-weight="bold">Age composition</text><text x="36" y="913" font-size="16" font-weight="normal">Selected group: age bars</text><text x="36" y="936" font-size="16" font-weight="normal">Count / within-group % switch</text><text x="36" y="959" font-size="16" font-weight="normal">All groups available in table</text><rect x="20" y="1007" width="365" height="111" rx="6" fill="white" stroke="#51616a"/><text x="36" y="1036" font-size="18" font-weight="bold">Takeaway and method</text><text x="36" y="1062" font-size="16" font-weight="normal">Source, caveats and exact tables</text><text x="36" y="1085" font-size="16" font-weight="normal">No page-wide sideways scroll</text></svg>
